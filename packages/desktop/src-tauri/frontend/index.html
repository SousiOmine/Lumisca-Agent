<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>Lumisca</title>
    <style>
      /* Splash shown while the desktop shell starts the bundled server.
         Colors match the app's dark theme (packages/web/src/styles/tokens.css). */
      :root {
        --bg: #0c0c11;
        --surface: #15151b;
        --border: #26262f;
        --text: #f3f3f7;
        --text-dim: #a5a5b2;
        --accent: #f3f3f7;
        --error: #ff9a90;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        user-select: none;
      }
      /* Custom title bar: the window is undecorated on Windows and Linux
         (tauri.conf.json), so the splash draws its own drag handle and
         window controls. On macOS the OS keeps its title bar
         (tauri.macos.conf.json: decorations + titleBarStyle overlay), so
         the native traffic lights stay where users expect them and this
         strip starts to their right. */
      .titlebar {
        display: flex;
        align-items: center;
        height: 32px;
        flex: none;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        user-select: none;
      }
      .titlebar.titled {
        padding-left: 78px;
        background: transparent;
        border-bottom: none;
      }
      .titlebar-wordmark {
        padding: 0 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--text-dim);
      }
      .titlebar-controls {
        display: flex;
        align-items: stretch;
        height: 100%;
        margin-left: auto;
      }
      .titlebar-btn {
        display: grid;
        place-items: center;
        width: 46px;
        height: 100%;
        color: var(--text-dim);
        background: none;
        border: none;
        cursor: pointer;
      }
      .titlebar-btn:hover {
        background: #23232d;
        color: #ffffff;
      }
      .titlebar-btn.close:hover {
        background: #c42b1c;
      }
      .hidden {
        display: none;
      }
      .splash {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .wordmark {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 28px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 18px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .status {
        color: var(--text-dim);
        font-size: 13px;
        margin: 0;
      }
      .status.error {
        color: var(--error);
        max-width: 420px;
        line-height: 1.5;
      }
      /* Startup failure with a way out: retry the remembered remote server
         or fall back to the local one. */
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 18px;
      }
      .btn {
        padding: 7px 14px;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--text-dim);
      }
      .btn.primary {
        color: #0c0c11;
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="titlebar" id="titlebar">
      <span class="titlebar-wordmark">Lumisca</span>
      <div class="titlebar-controls">
        <button
          type="button"
          class="titlebar-btn"
          id="btn-min"
          data-window-control
          title="最小化"
          aria-label="最小化"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M5 12h14" />
          </svg>
        </button>
        <button
          type="button"
          class="titlebar-btn"
          id="btn-max"
          data-window-control
          title="最大化"
          aria-label="最大化"
        >
          <svg
            id="icon-max"
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="5" y="5" width="14" height="14" rx="1" />
          </svg>
          <svg
            id="icon-restore"
            class="hidden"
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M9 5h9a1 1 0 0 1 1 1v9" />
            <rect x="5" y="9" width="11" height="11" rx="1" />
          </svg>
        </button>
        <button
          type="button"
          class="titlebar-btn close"
          id="btn-close"
          data-window-control
          title="閉じる"
          aria-label="閉じる"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
    </div>
    <div class="splash">
      <div class="wordmark">Lumisca</div>
      <div class="spinner" id="spinner"></div>
      <p class="status" id="status">起動中…</p>
      <div class="actions hidden" id="actions"></div>
    </div>
    <script src="splash.js"></script>
  </body>
</html>
