[package]
name = "lumisca-desktop"
version = "0.7.7"
description = "Lumisca Agent desktop shell"
edition = "2021"

[lib]
name = "lumisca_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The browser lab pane is a separate window overlaid on the main window
# (browser_lab.rs), so no unstable child-WebView APIs are needed.
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# OS notifications for agent events observed while the window is hidden
# (agent_end / question). Used only from Rust (notify.rs through the
# shell bridge) — never through frontend IPC — so no capability entry is
# needed, mirroring the updater/dialog pattern.
tauri-plugin-notification = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
# Shared browser-lab protocol pieces (RPC server, probe, URL policy).
lumisca-browser-rpc = { path = "../../browser-rpc" }

[target.'cfg(windows)'.dependencies]
# Same version tauri/tao already use (no duplicate in the tree). Used to
# force-activate the window before a bridge-started caption drag, and for
# IVirtualDesktopManager (the browser lab pane follows the main window
# across Windows virtual desktops — see browser_lab.rs).
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  # GetLocalTime, for the timestamp of every captured server log line
  # (server_log.rs).
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Storage_EnhancedStorage",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
# WinRT toasts under our own AppUserModelID with a click-to-focus handler
# (notify.rs). 0.8 tracks the windows 0.62 line (newer than the 0.61 the
# rest of the shell uses; the two coexist in the tree); the backend
# notify-rust (via tauri-plugin-notification) is used on other platforms.
tauri-winrt-notification = "0.8"
# Direct WebView2 COM access for the browser lab's CDP screenshot and
# (future) runtime/console/network events. Same version wry uses.
webview2-com = "0.38"

[target.'cfg(unix)'.dependencies]
# kill(2) for process-group teardown of the local server (server.rs).
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
