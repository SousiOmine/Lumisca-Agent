[package]
name = "lumisca-desktop"
version = "0.4.0"
description = "Lumisca Agent desktop shell"
edition = "2021"

[lib]
name = "lumisca_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
# Same version tauri/tao already use (no duplicate in the tree). Used to
# force-activate the window before a bridge-started caption drag.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# kill(2) for process-group teardown of the local server (server.rs).
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
