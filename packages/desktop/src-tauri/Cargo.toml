[package]
name = "lumisca-desktop"
version = "0.1.1"
description = "Lumisca Agent desktop shell"
edition = "2021"

[lib]
name = "lumisca_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
