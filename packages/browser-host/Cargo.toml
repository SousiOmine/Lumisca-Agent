[package]
name = "lumisca-browser-host"
version = "0.1.0"
description = "On-demand OS-standard WebView host for the Lumisca CLI's browser tools (wry + tao)"
edition = "2021"

[dependencies]
wry = "0.55"
tao = "0.35"
serde_json = "1"
lumisca-browser-rpc = { path = "../browser-rpc" }

[target.'cfg(windows)'.dependencies]
# Direct WebView2 COM access for the CDP screenshot (same versions wry uses).
webview2-com = "0.38"
windows = { version = "0.61" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true