[package]
name = "lumisca-browser-host"
version = "0.1.0"
description = "On-demand OS-standard WebView host for the Lumisca CLI's browser tools (wry + tao)"
edition = "2021"

[dependencies]
wry = "0.56"
tao = "0.37"
serde_json = "1"
lumisca-browser-rpc = { path = "../browser-rpc" }

[target.'cfg(windows)'.dependencies]
# Direct WebView2 COM access for the CDP screenshot. Versions intentionally
# TRACK wry's own pins (wry 0.56 uses webview2-com ^0.38 / windows ^0.61):
# bumping them ahead of wry would duplicate the crates in the tree and
# break the `CallDevToolsProtocolMethod` handler type identity.
webview2-com = "0.38"
windows = { version = "0.61" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true