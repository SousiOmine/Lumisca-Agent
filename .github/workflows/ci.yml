name: CI

on:
  push:
    # The repository's default branch is `master` (the workflow used to
    # name `main`, which does not exist — so CI only ran on pull requests
    # and direct pushes went unverified).
    branches: [master]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        # Windows (cmd.exe shell, OEM code pages, case-insensitive paths)
        # and macOS are just as first-class as Linux — they must run the
        # same suite.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          # Cache Deno's remote module + npm dependency downloads
          # (nodeModulesDir: "auto" reinstalls npm deps into node_modules
          # from the cache instead of re-downloading them).
          cache: true

      # node_modules cache: deno.json's imports drive the install, so the
      # lockfile-free install is keyed on deno.json + deno.lock.
      #
      # Windows is excluded on purpose. Deno's nodeModulesDir layout links
      # every package through a *junction*
      # (node_modules/sucrase -> node_modules/.deno/sucrase@x/node_modules/
      # sucrase), and Node resolves through it to the real path, which is
      # how a package finds its own dependencies in .deno/. actions/cache's
      # tar round-trip does not preserve junctions: the restored tree has
      # plain directory copies, so the real path is no longer inside .deno/
      # and resolution fails ("Cannot find module 'ts-interface-checker'" —
      # the eval tool's TypeScript stripping). macOS/Linux use symlinks,
      # which tar does preserve, so they keep the cache. The Deno
      # dependency cache above still spares Windows the re-download; only
      # the linking reruns (measured: ~1.5 min).
      - name: Cache node_modules
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('deno.json', 'deno.lock') }}

      # deno task check/lint/fmt:check/test live in the root deno.json —
      # running them via tasks keeps the permission flags (notably
      # --allow-ffi) defined in exactly one place.
      - name: Format check
        run: deno task fmt:check

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

      # The version lives in eight manifests (four deno.json, package.json,
      # tauri.conf.json, Cargo.toml, and packages/server/version.ts — the
      # constant a compiled server reports and updates against). The release
      # workflow pins them to the tag; checking them on every change catches
      # a half-done bump at the PR instead of at the tag.
      - name: Version consistency
        run: deno task check:versions

      - name: Test
        run: deno task test

  browser-rust:
    # The browser-rpc crate carries a real test suite (auth, 413, error
    # handling, RPC round-trips, URL policy, probe extraction) — run it so
    # a regression cannot slip through. The desktop shell is its only
    # consumer since the CLI browser host was removed.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/browser-rpc

      - name: Install Linux system dependencies (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Format check (browser-rpc)
        run: cargo fmt --check --manifest-path packages/browser-rpc/Cargo.toml

      - name: Clippy (browser-rpc)
        run: cargo clippy --manifest-path packages/browser-rpc/Cargo.toml -- -D warnings

      - name: Test (browser-rpc)
        run: cargo test --manifest-path packages/browser-rpc/Cargo.toml

  desktop:
    # Compile the desktop shell on every supported OS so a broken release
    # packaging (missing resources, Rust errors, platform-specific code)
    # does not go unnoticed. The toolchain for a full `tauri build`
    # (NSIS, dmg, webkit2gtk bundling) is heavy; compiling the crate and
    # checking that the server binary + embedded assets are produced
    # covers the failure modes that have actually bitten this project.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install Linux system dependencies (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # Generates the embedded frontend assets + server binary slot that
      # tauri-build validates at config-parse time.
      - name: Generate embedded assets
        run: npm run build:server:dev

      - name: Format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Compile
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # The shell carries unit tests (log truncation, port resolution).
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Compile server binary
        # The full `deno compile` (with its denort download) runs in the
        # server-package job below; here the entry must still type-check on
        # its own. Run from the repository root: packages/desktop is
        # deliberately NOT a workspace member (AGENTS.md — a member would
        # make `deno compile` embed src-tauri/target), so its own directory
        # lacks the root's nodeModulesDir: auto resolution for npm deps like
        # @types/node.
        run: deno check packages/server/mod.ts
        working-directory: ${{ github.workspace }}

  server-package:
    # The server-only distribution (compiled server + assets.json, no Tauri
    # shell) is what users without the desktop app run: build it and start it
    # on every platform we ship it for, on every change. The release workflow
    # runs the same two tasks, so a broken package fails here instead of at a
    # pushed tag. Linux matches release.yml's ubuntu-22.04 (glibc floor).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      # `deno compile` embeds node_modules, so the same cache the `check`
      # job uses applies here. Windows is excluded for the same reason: the
      # tar round-trip turns Deno's junctions into plain directories and
      # breaks module resolution.
      - name: Cache node_modules
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('deno.json', 'deno.lock') }}

      - name: Build packaged server
        run: deno task build:server

      - name: Smoke test packaged server
        run: deno task smoke:server
