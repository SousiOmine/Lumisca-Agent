name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check packages/core/mod.ts packages/server/mod.ts packages/cli/mod.ts

      - name: Test
        run: deno test packages/core packages/server packages/cli packages/web --allow-read --allow-write --allow-run --allow-env --allow-net
