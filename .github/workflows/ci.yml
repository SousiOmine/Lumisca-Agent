name: CI

on:
  push:
    # The repository's default branch is `master` (the workflow used to
    # name `main`, which does not exist — so CI only ran on pull requests
    # and direct pushes went unverified).
    branches: [master]
  pull_request:

# A newer run supersedes the older one: the commit it was checking can no
# longer be the tip, and the whole matrix costs ~5 minutes. Nothing is
# published from a CI run (release.yml builds the artifacts), so a cancelled
# run leaves nothing behind. Pull requests are grouped per branch, so a
# force-push supersedes its own run and not the one on the base branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      # One OS failing must not cancel the other two: the whole point of the
      # matrix is to see all three results in one run.
      fail-fast: false
      matrix:
        # Windows (cmd.exe shell, OEM code pages, case-insensitive paths)
        # and macOS are just as first-class as Linux — they must run the
        # same suite.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      # Bun's download cache only: `bun install` links node_modules in a few
      # seconds, so caching the tree itself buys little and risks the same
      # junction problems Deno's nodeModulesDir had on Windows.
      - name: Cache Bun's package cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Formatting and lint are one command (`biome check`), the type check
      # is tsc. Both are package.json scripts, so this file does not repeat
      # their arguments. The suite needs no runtime permission flags any
      # more — Bun has no equivalent of Deno's --allow-*.
      - name: Format and lint
        run: bun run fmt:check

      - name: Type check
        run: bun run check

      # The version lives in nine manifests (four deno.json, package.json,
      # package-lock.json, tauri.conf.json, Cargo.toml, and
      # packages/server/version.ts — the
      # constant a compiled server reports and updates against). The release
      # workflow pins them to the tag; checking them on every change catches
      # a half-done bump at the PR instead of at the tag.
      - name: Version consistency
        run: bun run check:versions

      - name: Test
        run: bun run test

  browser-rust:
    # The browser-rpc crate carries a real test suite (auth, 413, error
    # handling, RPC round-trips, URL policy, probe extraction) — run it so
    # a regression cannot slip through. The desktop shell is its only
    # consumer since the CLI browser host was removed.
    #
    # Its dependencies are serde, serde_json and url (plus their transitive
    # icu/idna crates): no GTK, no WebKit, and no `cfg(target_os)` in its
    # sources. That is why it needs neither the desktop's system packages
    # (installing them cost 21s of a 31s Linux job) nor three operating
    # systems; Windows stays because the desktop shell's own build checks
    # platform code there, and this crate compiles into that shell.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/browser-rpc

      - name: Format check (browser-rpc)
        run: cargo fmt --check --manifest-path packages/browser-rpc/Cargo.toml

      - name: Clippy (browser-rpc)
        run: cargo clippy --manifest-path packages/browser-rpc/Cargo.toml -- -D warnings

      - name: Test (browser-rpc)
        run: cargo test --manifest-path packages/browser-rpc/Cargo.toml

  desktop:
    # Compile the desktop shell on every supported OS so a broken release
    # packaging (missing resources, Rust errors, platform-specific code)
    # does not go unnoticed. The toolchain for a full `tauri build`
    # (NSIS, dmg, webkit2gtk bundling) is heavy; compiling the crate and
    # checking that the server binary + embedded assets are produced
    # covers the failure modes that have actually bitten this project.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      # The desktop's dev build runs the root build script, which needs the
      # root node_modules (esbuild, sucrase, …) — install them from the
      # repository root, not from packages/desktop.
      - name: Install root dependencies
        run: bun install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install Linux system dependencies (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # Generates the embedded frontend assets + server binary slot that
      # tauri-build validates at config-parse time.
      - name: Generate embedded assets
        run: npm run build:server:dev

      - name: Format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Compile
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # The shell carries unit tests (log truncation, port resolution).
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Type check the server entry
        # The full `bun build --compile` runs in the server-package job
        # below; here the entry must still type-check on its own, from the
        # repository root (packages/desktop is deliberately not a workspace
        # member, so its own directory lacks the root's dependencies).
        run: bun run check
        working-directory: ${{ github.workspace }}

  server-package:
    # The server-only distribution (compiled server + assets.json, no Tauri
    # shell) is what users without the desktop app run: build it and start it
    # on every platform we ship it for, on every change. The release workflow
    # runs the same two tasks, so a broken package fails here instead of at a
    # pushed tag. Linux matches release.yml's ubuntu-22.04 (glibc floor).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      # `bun build --compile` embeds node_modules, so the install happens
      # here too; the download cache keeps it to a few seconds.
      - name: Cache Bun's package cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packaged server
        run: bun run build:server

      - name: Smoke test packaged server
        run: bun run smoke:server
