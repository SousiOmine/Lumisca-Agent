name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        # Windows (cmd.exe shell, OEM code pages, case-insensitive paths)
        # and macOS are just as first-class as Linux — they must run the
        # same suite.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check packages/core/mod.ts packages/server/mod.ts packages/cli/mod.ts packages/web/src/client.tsx

      - name: Test
        run: deno test packages/core packages/server packages/cli packages/web --allow-read --allow-write --allow-run --allow-env --allow-net

  desktop:
    # Compile the desktop shell on every supported OS so a broken release
    # packaging (missing resources, Rust errors, platform-specific code)
    # does not go unnoticed. The toolchain for a full `tauri build`
    # (NSIS, dmg, webkit2gtk bundling) is heavy; compiling the crate and
    # checking that the server binary + embedded assets are produced
    # covers the failure modes that have actually bitten this project.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install Linux system dependencies (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # Generates the embedded frontend assets + server binary slot that
      # tauri-build validates at config-parse time.
      - name: Generate embedded assets
        run: npm run build:server:dev

      - name: Format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Compile
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Compile server binary
        # Full `npm run build:server` needs the denort download; verify the
        # packaged server entry compiles standalone instead.
        run: deno check ../../packages/server/mod.ts
