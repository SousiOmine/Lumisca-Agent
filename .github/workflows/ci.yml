name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        # Windows (cmd.exe shell, OEM code pages, case-insensitive paths)
        # and macOS are just as first-class as Linux — they must run the
        # same suite.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          # Cache Deno's remote module + npm dependency downloads
          # (nodeModulesDir: "auto" reinstalls npm deps into node_modules
          # from the cache instead of re-downloading them).
          cache: true

      # node_modules cache: deno.json's imports drive the install, so the
      # lockfile-free install is keyed on deno.json + deno.lock.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('deno.json', 'deno.lock') }}

      # deno task check/lint/fmt:check/test live in the root deno.json —
      # running them via tasks keeps the permission flags (notably
      # --allow-ffi) defined in exactly one place.
      - name: Format check
        run: deno task fmt:check

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

      - name: Test
        run: deno task test

  browser-rust:
    # The browser-rpc / browser-host crates carry real test suites
    # (auth, 413, error handling, RPC round-trips, URL policy, probe
    # extraction) — run them so a regression cannot slip through.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/browser-rpc
            packages/browser-host

      - name: Install Linux system dependencies (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Format check (browser-rpc)
        run: cargo fmt --check --manifest-path packages/browser-rpc/Cargo.toml

      - name: Clippy (browser-rpc)
        run: cargo clippy --manifest-path packages/browser-rpc/Cargo.toml -- -D warnings

      - name: Test (browser-rpc)
        run: cargo test --manifest-path packages/browser-rpc/Cargo.toml

      - name: Format check (browser-host)
        run: cargo fmt --check --manifest-path packages/browser-host/Cargo.toml

      - name: Clippy (browser-host)
        run: cargo clippy --manifest-path packages/browser-host/Cargo.toml -- -D warnings

      - name: Test (browser-host)
        run: cargo test --manifest-path packages/browser-host/Cargo.toml

  desktop:
    # Compile the desktop shell on every supported OS so a broken release
    # packaging (missing resources, Rust errors, platform-specific code)
    # does not go unnoticed. The toolchain for a full `tauri build`
    # (NSIS, dmg, webkit2gtk bundling) is heavy; compiling the crate and
    # checking that the server binary + embedded assets are produced
    # covers the failure modes that have actually bitten this project.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install Linux system dependencies (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # Generates the embedded frontend assets + server binary slot that
      # tauri-build validates at config-parse time.
      - name: Generate embedded assets
        run: npm run build:server:dev

      - name: Format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Compile
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Compile server binary
        # Full `npm run build:server` needs the denort download; verify the
        # packaged server entry compiles standalone instead.
        run: deno check ../../packages/server/mod.ts
