name: Release

# Pushing a `vX.Y.Z` tag builds the desktop app and the standalone server
# (the same compiled server without the desktop shell) on every supported
# platform, and creates a draft GitHub Release. Review the draft on GitHub
# and publish it — desktop users download the installer for their platform,
# server users the `lumisca-server-<version>-<platform>` archive, and the
# updater artifacts (`.sig` + `latest.json`, one per platform) are included
# so the in-app updater can be enabled later without changing the build
# pipeline. Both distributions carry the same version, so a tag ships them
# together.
#
# The desktop app updates from this release too, and its manifest must not
# send it through the GitHub *API*: tauri-action points every platform at
# `api.github.com/repos/.../releases/assets/<id>`, where an unauthenticated
# request is rejected without a `User-Agent` header and capped at 60 per
# hour per IP — over either limit GitHub answers 403, which the app reports
# as a failed download while the update check (a `github.com` CDN URL) still
# succeeds. The `rewrite-updater-json` job rewrites those URLs to the
# assets' public download links — the same link shape the server packages
# use — before the draft may be published.
#
# The standalone server updates itself from this release: each server
# package is signed with the same key as the desktop artifacts and published
# next to `latest-server-<target>.json`, the manifest a running server
# fetches through the `releases/latest/download/` shortcut (which only ever
# resolves once the release is published, so a draft can never be offered as
# an update). The signature and the package layout are re-verified with the
# updater's own implementation before upload
# (scripts/check-server-archive.ts) — a release that would break updates
# fails in CI instead of on a user's machine.
#
# macOS note: CI builds are unsigned. An unsigned app runs when opened
# manually, but Gatekeeper blocks it after download and the in-app updater
# cannot install unsigned updates. For production macOS distribution, set
# the APPLE_* secrets (certificate + notarytool) so tauri-action signs and
# notarizes the artifacts.
#
# Operation notes (learned from v0.6.1):
# - Do NOT publish the draft release until all matrix jobs (three desktop
#   bundles + the two server packages) are green AND the
#   `rewrite-updater-json` job has rewritten `latest.json`. Publishing early
#   freezes a partial `latest.json` (updater manifest) and offers a release
#   whose server archives are still missing.
# - Rerunning only the desktop matrix jobs (a rerun of failed jobs after a
#   bundle failed) re-uploads tauri-action's `latest.json`, undoing that
#   rewrite. Rerun the whole workflow, or dispatch the
#   `rewrite-updater-json` workflow on the tag.
# - The draft release is created exactly once by the `create-release` job
#   and the matrix jobs upload into it via `releaseId`. Letting every
#   matrix job get-or-create the release by tag races and produces two
#   Release objects sharing one tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  create-release:
    # Single writer for the draft Release — eliminates the parallel
    # get-or-create race between matrix jobs.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      releaseId: ${{ steps.create.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v7

      - name: Create draft release (reuse on rerun)
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::Expected a vX.Y.Z tag, got ref '$TAG'. Trigger this workflow by pushing a tag."; exit 1 ;;
          esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Lumisca $TAG" --generate-notes
          fi
          echo "releaseId=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-latest
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install Linux system dependencies (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # The tag version must match every place the app version lives;
      # a mismatch would publish a release whose updater manifest points
      # at the wrong version. The checker is shared with ci.yml so both
      # workflows agree on what "the version" means. (The job's
      # working-directory is packages/desktop, hence the ../../ prefix.)
      - name: Check version consistency
        run: deno run --allow-read ../../scripts/check-versions.ts "${{ github.ref_name }}"

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          # Upload into the draft created by `create-release` instead of
          # get-or-creating by tag in every matrix job (race → duplicate
          # releases sharing one tag, as happened with v0.6.1).
          releaseId: ${{ needs.create-release.outputs.releaseId }}
          tagName: v__VERSION__
          releaseName: "Lumisca v__VERSION__"
          releaseDraft: true
          generateReleaseNotes: true
          args: --bundles ${{ matrix.bundles }}
          updaterJsonPreferNsis: true

  rewrite-updater-json:
    # The manifest tauri-action just uploaded points every platform at the
    # GitHub API asset endpoint, which an installed app cannot reliably
    # fetch (see the header). This runs after all three desktop jobs merged
    # their platform entries into `latest.json` and rewrites those URLs to
    # the assets' public download links before anyone can publish the
    # draft — a published manifest with API URLs offers an update that
    # always fails to download, as v0.9.0 did.
    #
    # The workflow is also dispatchable on its own, to rewrite the manifest
    # of an already published release.
    needs: build-and-release
    permissions:
      contents: write
    uses: ./.github/workflows/rewrite-updater-json.yml
    with:
      tag: ${{ github.ref_name }}

  build-server:
    # The server-only distribution: the same compiled server the desktop
    # build embeds (scripts/build-server.ts is the single build path), zipped
    # with the `assets.json` it serves the UI from. No Tauri, no installer —
    # unpack and run.
    #
    # Each package is signed with the same key as the desktop artifacts and
    # published next to its own update manifest
    # (`latest-server-<target>.json`, written by
    # scripts/build-server-manifest.ts). The running server checks that
    # manifest shortly after startup and every six hours
    # (UPDATE_CHECK_INTERVAL_MS), and installs the package only if its
    # signature verifies (packages/server/update/), so a package that fails
    # to extract or verify must not reach a release: the check step below
    # runs the updater's own verifier and extractor on the real artifact.
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35: a binary built on ubuntu-24.04 would refuse to start
          # on Debian 12 / Ubuntu 22.04 (the binary needs the build host's
          # libc at least). If this label is retired, switch to ubuntu-24.04
          # and accept glibc 2.39+ on the target.
          - os: ubuntu-22.04
            platform: linux-x64
            # `deno compile` output directory for this runner
            # (Deno.build.target); also the release archive's payload.
            stage: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows-x64
            stage: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The Tauri CLI signs the packages (the same minisign key the desktop
      # updater uses); `npx` fetches it without needing a package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # The tag version must match every place the app version lives, exactly
      # as the desktop job checks it. Without this the job could upload a
      # server package whose manifest disagrees with the compiled binary's
      # `--version`, which the updater rejects on the user's machine (see
      # update/install.ts) — an update that can never be applied.
      - name: Check version consistency
        run: deno run --allow-read scripts/check-versions.ts "${{ github.ref_name }}"

      # Stages assets.json (+ icudtl.dat on Windows) and compiles the server
      # with the shared build path (packages/desktop runs the same script
      # for its bundled binary).
      - name: Build packaged server
        run: deno task build:server

      # Runs the produced binary like a user would: no LUMISCA_ASSETS_FILE,
      # then fetch the page and its assets (and check that the binary reports
      # the version it was built as, and that its update endpoints answer).
      - name: Smoke test packaged server
        run: deno task smoke:server

      # The archive carries a single top-level directory
      # (lumisca-server-<platform>/) so unpacking never scatters files into
      # the user's current directory. That name carries no version on
      # purpose: the server replaces its own files in place on update (see
      # packages/server/update/install.ts), so a version here would keep
      # advertising whichever release the directory was *first* unpacked
      # from — the number `ps`, a service unit or a support conversation
      # shows. The version lives in the archive's file name (checked by
      # scripts/build-server-manifest.ts, which refuses a mismatch), in the
      # release manifest, and in the binary itself (`--version`).
      #
      # What ships is exactly what `build:server` staged: the stage is the
      # single definition of a package's file set (the runtime reads the same
      # set back through installedFileNames in update/install.ts). A
      # hand-written list here silently dropped a file on a platform that
      # needed one more, so nothing is enumerated by hand.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="lumisca-server-${{ matrix.platform }}"
          ARCHIVE="dist/server/lumisca-server-${VERSION}-${{ matrix.platform }}.tar.gz"
          STAGE="dist/server/stage/${{ matrix.stage }}"
          mkdir -p "dist/server/release/${DIR}"
          # `.` + `-R`: the stage holds the stella machine's container files
          # as a directory, which a plain `cp stage/*` would refuse.
          cp -R "$STAGE"/. "dist/server/release/${DIR}/"
          ls -lR "dist/server/release/${DIR}"
          tar -C dist/server/release -czf "$ARCHIVE" "$DIR"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          ls -l "$ARCHIVE"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $dir = "lumisca-server-${{ matrix.platform }}"
          $archive = "dist/server/lumisca-server-$version-${{ matrix.platform }}.zip"
          $stage = "dist/server/stage/${{ matrix.stage }}"
          New-Item -ItemType Directory -Force -Path "dist/server/release/$dir" | Out-Null
          # `-Recurse`: the stage holds the stella machine's container files
          # as a directory, which a plain copy drops (an empty directory
          # would reach the archive instead).
          Copy-Item "$stage/*" "dist/server/release/$dir/" -Recurse
          Get-ChildItem -Recurse "dist/server/release/$dir" | Select-Object FullName, Length
          Compress-Archive -Path "dist/server/release/$dir" -DestinationPath $archive -Force
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $archive | Select-Object Name, Length

      # Signs the package with the release key (TAURI_SIGNING_PRIVATE_KEY) —
      # the same identity the desktop updater verifies, so there is one key
      # to rotate, not two. A missing key fails here on purpose: publishing
      # an unsigned package would silently stop every server from updating.
      - name: Sign the package
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@2 signer sign "$ARCHIVE"
          ls -l "$ARCHIVE.sig"

      # Verify the real artifact with the updater's own implementation
      # (signature + container + contents) before it can be published.
      #
      # `shell: bash` on every step that expands `$ARCHIVE`: the default shell
      # on a Windows runner is pwsh, where a trailing `\` is not a line
      # continuation (the step died with a ParserError before running anything
      # — v0.8.0) and `$ARCHIVE` would be a PowerShell variable (unset) rather
      # than the environment variable the packaging step exported. The
      # packaging/signing/upload steps around it use bash for the same reason.
      - name: Verify the package installs as an update
        shell: bash
        run: |
          deno run --allow-read --allow-write scripts/check-server-archive.ts \
            --archive "$ARCHIVE" --signature "$ARCHIVE.sig" \
            --stage "dist/server/stage/${{ matrix.stage }}"

      - name: Write the update manifest
        shell: bash
        run: |
          deno run --allow-read --allow-write scripts/build-server-manifest.ts \
            --archive "$ARCHIVE" --signature "$ARCHIVE.sig" \
            --tag "${{ github.ref_name }}" --target "${{ matrix.stage }}" \
            --out "dist/server/latest-server-${{ matrix.stage }}.json"
          cat "dist/server/latest-server-${{ matrix.stage }}.json"

      # `--clobber` keeps a rerun of the workflow idempotent. Drafts are
      # addressed by tag; the release itself was created by create-release.
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "$ARCHIVE" "$ARCHIVE.sig" \
            "dist/server/latest-server-${{ matrix.stage }}.json" --clobber
