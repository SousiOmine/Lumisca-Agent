name: Release

# Pushing a `vX.Y.Z` tag builds the desktop app and creates a draft
# GitHub Release. Review the draft on GitHub and publish it — new users
# download the NSIS installer from there, and the updater artifacts
# (`.sig` + `latest.json`) are included so the in-app updater can be
# enabled later without changing the build pipeline.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      # The tag version must match every place the app version lives;
      # a mismatch would publish a release whose updater manifest points
      # at the wrong version.
      - name: Check version consistency
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag=$EXPECTED conf=$CONF cargo=$CARGO"
          if [ "$EXPECTED" != "$CONF" ] || [ "$EXPECTED" != "$CARGO" ]; then
            echo "::error::Version mismatch — tag $TAG expects $EXPECTED but found conf=$CONF cargo=$CARGO"
            exit 1
          fi

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tagName: v__VERSION__
          releaseName: "Lumisca v__VERSION__"
          releaseDraft: true
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
