name: Release

# Pushing a `vX.Y.Z` tag builds the desktop app on every supported OS and
# creates a draft GitHub Release. Review the draft on GitHub and publish
# it — new users download the installer for their platform from there, and
# the updater artifacts (`.sig` + `latest.json`, one per platform) are
# included so the in-app updater can be enabled later without changing the
# build pipeline.
#
# macOS note: CI builds are unsigned. An unsigned app runs when opened
# manually, but Gatekeeper blocks it after download and the in-app updater
# cannot install unsigned updates. For production macOS distribution, set
# the APPLE_* secrets (certificate + notarytool) so tauri-action signs and
# notarizes the artifacts.
#
# Operation notes (learned from v0.6.1):
# - Do NOT publish the draft release until all three matrix jobs are green.
#   Publishing early freezes a partial `latest.json` (updater manifest).
# - The draft release is created exactly once by the `create-release` job
#   and the matrix jobs upload into it via `releaseId`. Letting every
#   matrix job get-or-create the release by tag races and produces two
#   Release objects sharing one tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  create-release:
    # Single writer for the draft Release — eliminates the parallel
    # get-or-create race between matrix jobs.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      releaseId: ${{ steps.create.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v7

      - name: Create draft release (reuse on rerun)
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::Expected a vX.Y.Z tag, got ref '$TAG'. Trigger this workflow by pushing a tag."; exit 1 ;;
          esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Lumisca $TAG" --generate-notes
          fi
          echo "releaseId=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-latest
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install Linux system dependencies (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # The tag version must match every place the app version lives;
      # a mismatch would publish a release whose updater manifest points
      # at the wrong version.
      - name: Check version consistency
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          NPCKG=$(node -p "require('./package.json').version")
          DNJSON=$(node -e "const t=require('fs').readFileSync('deno.json','utf8');const m=t.match(/\"version\":\s*\"([^\"]+)\"/);console.log(m?m[1]:'')")
          echo "tag=$EXPECTED conf=$CONF cargo=$CARGO npm=$NPCKG deno=$DNJSON"
          FAIL=""
          for pair in "conf:$CONF" "cargo:$CARGO" "npm package.json:$NPCKG" "deno.json:$DNJSON"; do
            NAME="${pair%%:*}"; VAL="${pair#*:}"
            if [ "$VAL" != "$EXPECTED" ]; then
              echo "::error::$NAME version $VAL != tag $EXPECTED"
              FAIL=1
            fi
          done
          if [ -n "$FAIL" ]; then
            echo "::error::Version mismatch — tag $TAG expects $EXPECTED; update every manifest before tagging."
            exit 1
          fi

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          # Upload into the draft created by `create-release` instead of
          # get-or-creating by tag in every matrix job (race → duplicate
          # releases sharing one tag, as happened with v0.6.1).
          releaseId: ${{ needs.create-release.outputs.releaseId }}
          tagName: v__VERSION__
          releaseName: "Lumisca v__VERSION__"
          releaseDraft: true
          generateReleaseNotes: true
          args: --bundles ${{ matrix.bundles }}
          updaterJsonPreferNsis: true
