name: Release

# Pushing a `vX.Y.Z` tag builds the desktop app on every supported OS and
# creates a draft GitHub Release. Review the draft on GitHub and publish
# it — new users download the installer for their platform from there, and
# the updater artifacts (`.sig` + `latest.json`, one per platform) are
# included so the in-app updater can be enabled later without changing the
# build pipeline.
#
# macOS note: CI builds are unsigned. An unsigned app runs when opened
# manually, but Gatekeeper blocks it after download and the in-app updater
# cannot install unsigned updates. For production macOS distribution, set
# the APPLE_* secrets (certificate + notarytool) so tauri-action signs and
# notarizes the artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-latest
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install Linux system dependencies (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # The tag version must match every place the app version lives;
      # a mismatch would publish a release whose updater manifest points
      # at the wrong version.
      - name: Check version consistency
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag=$EXPECTED conf=$CONF cargo=$CARGO"
          if [ "$EXPECTED" != "$CONF" ] || [ "$EXPECTED" != "$CARGO" ]; then
            echo "::error::Version mismatch — tag $TAG expects $EXPECTED but found conf=$CONF cargo=$CARGO"
            exit 1
          fi

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tagName: v__VERSION__
          releaseName: "Lumisca v__VERSION__"
          releaseDraft: true
          generateReleaseNotes: true
          args: --bundles ${{ matrix.bundles }}
          updaterJsonPreferNsis: true
